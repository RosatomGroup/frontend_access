version: '3.8'

services:
  rbac:
    build: .
    container_name: rbac
    ports: 
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_S3_ENDPOINT=${NEXT_PUBLIC_S3_ENDPOINT}
      - NEXT_PUBLIC_S3_BUCKET=${NEXT_PUBLIC_S3_BUCKET}
      - NEXT_PUBLIC_S3_REGION=${NEXT_PUBLIC_S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    networks:
      - rbac-net

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-rbac
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx-conf:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - rbac
    ports:
      - "80:80"
      - "443:443"
    networks:
      - rbac-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes: 
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/certbot --email pavlikdemin@ya.ru --agree-tos --no-eff-email -d rosatomaccess.ru -d www.rosatomaccess.ru --keep-until-expiring --non-interactive

networks:
  rbac-net:
    driver: bridge