upstream frontend {
    server rbac:3000;
    keepalive 32;
}

upstream backend {
    server backend:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name rosatomaccess.ru www.rosatomaccess.ru;
    
    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rosatomaccess.ru www.rosatomaccess.ru;

    ssl_certificate /etc/letsencrypt/live/rosatomaccess.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosatomaccess.ru/privkey.pem;
    
    # Настройки SSL из mozilla modern configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Frontend Next.js
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Оптимизации для Next.js
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 60s;
    }

    # Статика Next.js
    location /_next/static {
        proxy_pass http://frontend/_next/static;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # LetsEncrypt для Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Ошибки
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}